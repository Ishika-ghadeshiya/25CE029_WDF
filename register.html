
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>
    <link rel="stylesheet" href="css/practical5.css">
</head>
<body>

    <div class="container">
        <h1>Student Registration</h1>

        <form id="registrationForm" novalidate>

            <label for="name">Full Name</label>
            <input type="text" id="name" placeholder="Enter your full name" required>
            <small id="nameError"></small>

            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Enter your email" required>
            <small id="emailError"></small>

            <label for="mobile">Mobile Number</label>
            <input type="tel" id="mobile" placeholder="10-digit mobile number" required>
            <small id="mobileError"></small>

            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter password" required>
            <small id="passwordError"></small>

            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" placeholder="Confirm password" required>
            <small id="confirmPasswordError"></small>

            <label for="course">Course</label>
            <select id="course" required>
                <option value="">Select Course</option>
                <option value="CE">Computer Engineering</option>
                <option value="IT">Information Technology</option>
                <option value="CSE">Computer Science</option>
                <option value="EC">Electronics Engineering</option>
            </select>
            <small id="courseError"></small>

            <label for="year">Year of Study</label>
            <select id="year" required>
                <option value="">Select Year</option>
                <option value="1">First Year</option>
                <option value="2">Second Year</option>
                <option value="3">Third Year</option>
                <option value="4">Fourth Year</option>
            </select>
            <small id="yearError"></small>

            <label>Gender</label>
            <div class="gender">
                <label><input type="radio" name="gender" value="Male"> Male</label>
                <label><input type="radio" name="gender" value="Female"> Female</label>
                <label><input type="radio" name="gender" value="Other"> Other</label>
            </div>
            <small id="genderError"></small>

            <div class="terms">
                <label>
                    <input type="checkbox" id="terms">
                    I accept the terms and conditions
                </label>
            </div>
            <small id="termsError"></small>

            <button type="submit">Register</button>
            <p id="successMessage" role="status"></p>

        </form>
    </div>

    <script src="JS/practical5.js"></script>
</body>
</html>
