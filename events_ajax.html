<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Management - Fetch API</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 25px;
            background: #f4f6f9;
            color: #222;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 10px #ddd;
        }

        h1, h2 {
            color: #243b55;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        input, textarea {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font: inherit;
        }

        textarea {
            min-height: 80px;
            resize: vertical;
        }

        .full {
            grid-column: 1 / -1;
        }

        button {
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            color: white;
            background: #2463a6;
            margin: 3px;
        }

        button:hover {
            opacity: 0.85;
        }

        .delete {
            background: #c0392b;
        }

        .edit {
            background: #21865b;
        }

        #message {
            margin: 15px 0;
            font-weight: bold;
        }

        .event {
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 7px;
            margin: 12px 0;
            overflow-wrap: anywhere;
        }

        .event h3 {
            margin-top: 0;
        }

        @media (max-width: 600px) {
            body {
                padding: 10px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .full {
                grid-column: auto;
            }
        }
    </style>
</head>

<body>
<div class="container">
    <h1>Event Management</h1>
    <p>Add, view, update and delete events without reloading the page.</p>

    <h2 id="formTitle">Add Event</h2>

    <form id="eventForm">
        <input type="hidden" id="eventId">

        <div class="form-grid">
            <input type="text" id="title" placeholder="Event title" required>
            <input type="date" id="event_date" required>

            <input type="text" id="venue" placeholder="Event venue" required>
            <textarea id="description" class="full"
                      placeholder="Event description" required></textarea>

            <div class="full">
                <button type="submit" id="saveButton">Add Event</button>
                <button type="button" id="cancelButton" hidden>
                    Cancel Edit
                </button>
                <button type="button" id="refreshButton">
                    Refresh Events
                </button>
            </div>
        </div>
    </form>

    <p id="message" role="status" aria-live="polite"></p>

    <h2>All Events</h2>
    <div id="eventsList">Loading events...</div>
</div>

<script>
    const API_URL = "events_api.php";

    const form = document.getElementById("eventForm");
    const eventId = document.getElementById("eventId");
    const title = document.getElementById("title");
    const description = document.getElementById("description");
    const eventDate = document.getElementById("event_date");
    const venue = document.getElementById("venue");
    const message = document.getElementById("message");
    const eventsList = document.getElementById("eventsList");
    const saveButton = document.getElementById("saveButton");
    const cancelButton = document.getElementById("cancelButton");
    const formTitle = document.getElementById("formTitle");

    function showMessage(text, isError = false) {
        message.textContent = text;
        message.style.color = isError ? "#c0392b" : "#21865b";
    }

    async function requestAPI(method, data = null) {
        const options = { method };

        if (data !== null) {
            options.headers = {
                "Content-Type": "application/json"
            };
            options.body = JSON.stringify(data);
        }

        const response = await fetch(API_URL, options);

        let result;
        try {
            result = await response.json();
        } catch {
            throw new Error("The server returned an invalid response.");
        }

        if (!response.ok || !result.success) {
            throw new Error(result.message || "Request failed.");
        }

        return result;
    }

    function createElement(tag, text, className = "") {
        const element = document.createElement(tag);
        element.textContent = text;

        if (className) {
            element.className = className;
        }

        return element;
    }

    function renderEvents(events) {
        eventsList.replaceChildren();

        if (events.length === 0) {
            eventsList.textContent = "No events found.";
            return;
        }

        events.forEach(event => {
            const card = document.createElement("div");
            card.className = "event";

            card.appendChild(createElement("h3", event.title));
            card.appendChild(createElement("p", event.description));
            card.appendChild(createElement("p", "Date: " + event.event_date));
            card.appendChild(createElement("p", "Venue: " + event.venue));

            const editButton = createElement("button", "Edit", "edit");
            editButton.type = "button";
            editButton.addEventListener("click", () => editEvent(event));

            const deleteButton = createElement("button", "Delete", "delete");
            deleteButton.type = "button";
            deleteButton.addEventListener("click", () => deleteEvent(event.id));

            card.append(editButton, deleteButton);
            eventsList.appendChild(card);
        });
    }

    async function loadEvents() {
        eventsList.textContent = "Loading events...";

        try {
            const result = await requestAPI("GET");
            renderEvents(result.data || []);
        } catch (error) {
            eventsList.textContent = "Could not load events.";
            showMessage(error.message, true);
        }
    }

    function editEvent(event) {
        eventId.value = event.id;
        title.value = event.title;
        description.value = event.description;
        eventDate.value = event.event_date;
        venue.value = event.venue;

        formTitle.textContent = "Update Event";
        saveButton.textContent = "Update Event";
        cancelButton.hidden = false;

        form.scrollIntoView({ behavior: "smooth" });
    }

    function resetForm() {
        form.reset();
        eventId.value = "";
        formTitle.textContent = "Add Event";
        saveButton.textContent = "Add Event";
        cancelButton.hidden = true;
    }

    form.addEventListener("submit", async function (event) {
        event.preventDefault();

        const id = eventId.value;

        const data = {
            title: title.value.trim(),
            description: description.value.trim(),
            event_date: eventDate.value,
            venue: venue.value.trim()
        };

        if (id) {
            data.id = Number(id);
        }

        try {
            const result = await requestAPI(id ? "PUT" : "POST", data);

            showMessage(result.message);
            resetForm();
            await loadEvents();
        } catch (error) {
            showMessage(error.message, true);
        }
    });

    async function deleteEvent(id) {
        if (!confirm("Are you sure you want to delete this event?")) {
            return;
        }

        try {
            const result = await requestAPI("DELETE", { id: Number(id) });
            showMessage(result.message);
            await loadEvents();
        } catch (error) {
            showMessage(error.message, true);
        }
    }

    cancelButton.addEventListener("click", resetForm);
    document.getElementById("refreshButton").addEventListener("click", loadEvents);

    loadEvents();
</script>
</body>
</html>
